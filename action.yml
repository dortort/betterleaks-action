name: 'Betterleaks Action'
description: 'Scan for secrets and credentials using Betterleaks v2 with built-in SARIF 2.1.0 conversion'
author: 'dortort'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  version:
    description: 'Betterleaks v2 version (e.g., v2.0.0, v2.0.0-rc.15, latest, or latest-rc)'
    required: false
    default: 'latest'
  scan-mode:
    description: 'Scan mode: filesystem (or fs), git, stdin, or auto (auto detects from event type)'
    required: false
    default: 'auto'
  scan-path:
    description: 'Path to scan (positional argument for filesystem and git modes)'
    required: false
    default: '.'
  config:
    description: 'Path to Betterleaks v2 config file (not auto-discovered in v2)'
    required: false
    default: ''
  report-format:
    description: 'Report format: sarif, json, or jsonl'
    required: false
    default: 'sarif'
  report-path:
    description: 'Path to write the report file (defaults to betterleaks-report.<format>)'
    required: false
    default: ''
  redact:
    description: 'Redact secrets from output'
    required: false
    default: 'true'
  exit-code:
    description: 'Custom exit code when leaks are found'
    required: false
    default: ''
  no-color:
    description: 'Disable colored output'
    required: false
    default: 'true'
  no-banner:
    description: 'Suppress ASCII banner'
    required: false
    default: 'true'
  validate:
    description: 'Enable live credential validation against provider APIs (opt-in)'
    required: false
    default: 'false'
  analyze:
    description: 'Enable credential identity and permission analysis (implies validate)'
    required: false
    default: 'false'
  extra-args:
    description: 'Additional CLI arguments passed directly to betterleaks'
    required: false
    default: ''
  fail-on-leak:
    description: 'Fail the action if leaks are found'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for authenticated API calls (version resolution)'
    required: false
    default: ${{ github.token }}
  timeout:
    description: 'Scan timeout in seconds'
    required: false
    default: '300'

outputs:
  exit-code:
    description: 'Betterleaks process exit code'
  report-path:
    description: 'Path to the generated report file'
  sarif-path:
    description: 'Path to SARIF 2.1.0 file when report-format is sarif (for github/codeql-action/upload-sarif)'
  leaks-found:
    description: 'Whether leaks were found (true/false)'
  leak-count:
    description: 'Number of leaks found (available for sarif, json, and jsonl formats)'

runs:
  using: 'node24'
  main: 'dist/index.js'
